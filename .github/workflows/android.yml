name: Build and Sign APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-sign:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Step 2: Set up Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      # Step 3: Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      # Step 4: Decode signing keystore
      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'keystore.jks'
          encodedString: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        
      # Step 5: Build signed release
      - name: Build Signed Release
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ steps.decode_keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        
      # Step 6: Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: al-shamri-currency-converter-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
      # (Optional) Add notification step
      - name: Success Notification
        if: success()
        run: echo "APK built and signed successfully"
